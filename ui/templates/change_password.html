{% extends 'base.html' %}
{% block title %}修改密码 · IPTV 管理{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">SECURE YOUR WORKSPACE</div><h1>先设置你的专属密码</h1><p class="muted">{{ '首次登录，请修改初始密码后进入工作台。' if user.must_change_password else '更新你的管理员登录密码。' }}</p></div></div>
<section class="panel" style="max-width:600px">
  <div class="panel-head"><h2>修改密码</h2><span class="badge">{{ username }}</span></div>
  <form method="post" action="/_admin/settings/password" style="display:grid;gap:14px">
    <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
    <label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="12" required placeholder="至少 12 位，使用你自己的密码"></label>
    <label>确认新密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required placeholder="再次输入新密码"></label>
    <p class="hint">保存后将退出当前会话，请使用新密码重新登录。后续更新和重新部署会保留你的密码。</p>
    <div class="actions"><button class="btn primary" type="submit">保存新密码</button></div>
  </form>
</section>
{% endblock %}
